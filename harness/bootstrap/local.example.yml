OMP_ARCHIVE_GITHUB_REPO: owner/omp-archive-index
OMP_ARCHIVE_INDEX_DIR: /absolute/path/to/omp-data/github/archive-index
OMP_CONTROL_DB: /absolute/path/to/home/.omp/agent/orchestration.sqlite
